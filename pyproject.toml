[project]
name = "carelite"
version = "0.1.0"
description = "Evidence-based AI assistant for patient communication, with its evaluation study"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "typer>=0.15",
    "rich>=13.9",
    "httpx>=0.28",
    "ollama>=0.4",
    "networkx>=3.4",
    "numpy>=2.1",
    "scipy>=1.14",
    "pandas>=2.2",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "pymupdf>=1.24",
    "tenacity>=9.0",
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=3.3", "torch>=2.5"]
# The orchestration layer. `carelite/generate/graph.py` declares its topology once
# and compiles it two ways: `to_langgraph()` when the library is present, a built-in
# executor when it is not. Extra rather than core so a machine without langgraph
# still runs the system -- which is how all 939 existing generations were produced.
orchestration = [
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
]
# The LangChain retrieval adapter measured against the native pipeline in
# `carelite/retrieval/langchain_adapter.py`. Never the default: the native stack
# produced the study's rows and continues to.
langchain = [
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-ollama>=0.2",
    "langchain-postgres>=0.0.12",
    "rank-bm25>=0.2.2",
]
# vLLM served on a remote GPU speaks an OpenAI-compatible API; only the client
# moves, not the graph. vLLM itself is never installed here -- it runs on the pod.
vllm = ["openai>=1.55"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "detect-secrets>=1.5",
]

[project.scripts]
carelite = "carelite.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["carelite"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "inference: hits a live Ollama model; excluded from `make check`",
    "db: requires a live Postgres with the schema applied",
    "security: adversarial input corpus",
]
addopts = "-m 'not inference' --strict-markers"
